<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>FPFood</title>

    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0066cc" />

    <style>
        body { 
            font-family: system-ui, sans-serif; 
            margin: 0; 
            background: #f5f5f5;
        }
        header {
            background: #0066cc;
            padding: 12px;
            display: flex;
            align-items: center;
            color: white;
        }
        header img {
            height: 48px;
            margin-right: 12px;
        }
        main {
            padding: 16px;
            max-width: 600px;
            margin: auto;
        }
        label { margin-top: 12px; display: block; }
        input, select, button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            margin-top: 6px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }
        button {
            background: #0066cc;
            color: white;
            border: none;
            margin-top: 20px;
        }
        .list-item {
            background: white;
            padding: 12px;
            margin-top: 10px;
            border-radius: 6px;
            border: 1px solid #ddd;
        }
        .actions {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }
        .actions button {
            flex: 1;
            background: #444;
        }
        .actions .delete {
            background: #aa0000;
        }
        .totale {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>
<header>
    <img src="icons/azienda.png" alt="logo" />
    <h2>FPFood</h2>
</header>

<main>

    <h3 id="utenteLabel"></h3>

    <label>Ristorante</label>
    <select id="rist">
        <option value="">Seleziona</option>
        <option>Orto dei longobardi</option>
        <option>Sace Group</option>
    </select>

    <label>Data</label>
    <input type="date" id="data" />

	<label>Importo</label>
	<div style="display:flex;gap:8px;align-items:center">
	  <input type="number" step="0.01" id="importo" style="flex:1"/>
      <button id="scanBtn" title="Scansiona scontrino" style="width:44px;height:44px;padding:0;border-radius:8px;background:#eef;border:1px solid #99c;cursor:pointer">
       <img src="icons/scan.png" alt="scan" style="width:24px;height:24px;vertical-align:middle;border:0;background:transparent"/>
      </button>
      <input id="scan-file" type="file" accept="image/*" capture="environment" style="display:none">
      <span id="scanStatus" style="font-size:12px;color:#555;margin-left:6px">Pronto</span>
	</div>
	<button id="salvaBtn">Salva</button>

	<script>
	  // === FPFOOD — Scan inline (OCR + auto-fill + download foto) ===
	  window.addEventListener('load', () => {
		const $scanBtn  = document.getElementById('scanBtn');
		const $scanFile = document.getElementById('scan-file');
		const $rist     = document.getElementById('rist');
		const $data     = document.getElementById('data');
		const $importo  = document.getElementById('importo');

		function toISO(gg, mm, aa) {
		  // normalizza a numeri
		  let d = parseInt(String(gg).replace(/\D/g, ''), 10);
		  let m = parseInt(String(mm).replace(/\D/g, ''), 10);
		  let y = parseInt(String(aa).replace(/\D/g, ''), 10);

		  // anno a 2 cifre -> 20xx
		  if (y < 100) y += 2000;

		  // controlli base
		  if (!(y >= 2000 && y <= 2100)) return '';
		  if (!(m >= 1 && m <= 12)) return '';
		  if (!(d >= 1 && d <= 31)) return '';

		  const pad = (n) => String(n).padStart(2, '0');
		  return `${y}-${pad(m)}-${pad(d)}`;
		}

		function parseQuick(text) {
		  const lines = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);

		  // fornitore: prima riga non “scontrino”
		  let merchant = '';
		  for (const l of lines) {
			const u = l.toUpperCase();
			if (u.includes('SCONTRINO')) continue;
			merchant = l;
			break;
		  }

		  // data: supporta "DATA" / "DATA ORA", separatori / - . e spazi
		  let dateISO = '';

		  // "DATA ORA: 22/02/26 19:03" o "DATA: 22.02.2026"
		  const reDataPref = /DATA(?:\s*ORA)?\s*[:\-]?\s*(\d{1,2})\s*[\/.\-]\s*(\d{1,2})\s*[\/.\-]\s*(\d{2,4})/i;
		  // 22/02/2026 | 22-02-26 | 22.02.26 (anche con spazi)
		  const reDMY     = /(\b)(\d{1,2})\s*[\/.\-]\s*(\d{1,2})\s*[\/.\-]\s*(\d{2,4})(\b)/;
		  // 2026-02-22 (anche con spazi)
		  const reYMD     = /(\b)(\d{4})\s*-\s*(\d{1,2})\s*-\s*(\d{1,2})(\b)/;

		  for (const l of lines) {
			let m = l.match(reDataPref);
			if (m) { dateISO = toISO(m[1], m[2], m[3]); break; }

			m = l.match(reDMY);
			if (m) { dateISO = toISO(m[2], m[3], m[4]); break; }

			m = l.match(reYMD);
			if (m) { dateISO = toISO(m[4], m[3], m[2]); break; } // y-m-d -> (d,m,y)
		  }

		  // totale: ultimo importo (12,34 | 12.34 | 12, 34)
		  const amountMatches = [...text.matchAll(/\d+[.,]\s?\d{2}/g)].map(x => x[0].replace(/\s+/g,''));
		  const total = (amountMatches.length ? amountMatches[amountMatches.length - 1] : '').replace(',', '.');

		  return { merchant, dateISO, total };
		}

		function mapRistorante(text) {
		  const u = text.toUpperCase();
		  if (u.includes('SACE')) return 'Sace Group';
		  if (u.includes('ORTO') || u.includes('LONGOBARDI')) return 'Orto dei longobardi';
		  return '';
		}

		function sanitizeName(s) {
		  return (s || 'scontrino')
				 .normalize('NFKD').replace(/[^\w\s-]/g,'')
				 .trim().replace(/\s+/g,'_').toLowerCase();
		}

		async function doOCR(file) {
		  const { data } = await Tesseract.recognize(file, 'ita+eng', {
			logger: m => console.log(m.status || '', m.progress || '')
		  });
		  return data && data.text ? data.text : '';
		}

		function autoDownload(file, merchant) {
		  const ts = new Date();
		  const y  = ts.getFullYear();
		  const mo = String(ts.getMonth()+1).padStart(2,'0');
		  const d  = String(ts.getDate()).padStart(2,'0');
		  const h  = String(ts.getHours()).padStart(2,'0');
		  const mi = String(ts.getMinutes()).padStart(2,'0');
		  const s  = String(ts.getSeconds()).padStart(2,'0');
		  const name = `scan_${sanitizeName(merchant)}_${y}${mo}${d}_${h}${mi}${s}.jpg`;

		  const url = URL.createObjectURL(file);
		  const a = document.createElement('a');
		  a.href = url;
		  a.download = name; // download locale (non su server)
		  document.body.appendChild(a);
		  a.click();
		  a.remove();
		  URL.revokeObjectURL(url);
		}

		$scanBtn?.addEventListener('click', () => $scanFile?.click());

		$scanFile?.addEventListener('change', async () => {
		  const file = $scanFile.files?.[0];
		  if (!file) return;

		  const $status = document.getElementById('scanStatus');
		  const setStatus = (s) => { if ($status) $status.textContent = s; };

		  try {
			setStatus('Carico immagine...');
			// INFO rapida sul file
			console.log('SCAN file:', file?.type, Math.round((file?.size || 0)/1024), 'KB');

			if (typeof Tesseract === 'undefined') {
			  alert('Tesseract non caricato (rete/CDN o cache). Riprova dopo qualche secondo.');
			  setStatus('CDN non pronto');
			  return;
			}

			setStatus('Avvio OCR (download motore)...');
			const { data } = await Tesseract.recognize(file, 'ita+eng', {
			  logger: m => {
				// m.status: 'loading tesseract core','initializing tesseract','loading language traineddata','recognizing text'
				if (m?.status && m?.progress != null) {
				  const pct = Math.round(m.progress * 100);
				  setStatus(`${m.status} ${pct}%`);
				}
			  }
			});

			const text = (data && data.text) ? data.text : '';
			console.log('OCR text (first 120):', text.slice(0,120).replace(/\s+/g,' '));

			const { merchant, dateISO, total } = parseQuick(text);

			const ristValue = mapRistorante(text) || mapRistorante(merchant);
			if (ristValue) {
			  $rist.value = ristValue;
			} else {
			  console.log('OCR: ristorante non mappato (solo Orto è supportato).');
			}
			if (/^\d{4}-\d{2}-\d{2}$/.test(dateISO)) {
			  $data.value = dateISO;
			} else {
			  console.log('OCR: data non valida, non aggiorno il campo.', dateISO);
			}
			if (total)   { $importo.value = parseFloat(total).toFixed(2); }

			setStatus('Completato');
			if (dateISO || total) {
			  autoDownload(file, merchant || ristValue || 'scontrino');
			} else {
			  console.log('OCR: nessuna data/importo trovati — non salvo la foto.');
			}
		  } catch (e) {
			console.error('OCR error:', e);
			setStatus('Errore OCR');
			alert('Errore durante la scansione: ' + (e && e.message ? e.message : 'vedi console'));
		  } finally {
			$scanFile.value = ''; // per poter riselezionare lo stesso file
			setTimeout(() => setStatus('Pronto'), 1200);
		  }
		});

	  });
	</script>

    <h3>📋 Pasti salvati</h3>
    <div id="lista"></div>

    <div class="totale" id="totaleBox">Totale: 0 €</div>

</main>

<script>
const API = "https://fpfood-backend.onrender.com/api";

// ----------------------
// UTENTE (solo prima volta)
// ----------------------
if (!localStorage.getItem("fpfood_user")) {
    let nome = "";
    while (!nome.trim()) {
        nome = prompt("Inserisci Nome e Cognome:");
    }
    localStorage.setItem("fpfood_user", nome.trim());
}

const userFull = localStorage.getItem("fpfood_user");

// Chiave URL robusta (codifica /, spazi, e TUTTI gli apostrofi)
function _userKey() {
  // prima codifico tutto
  let key = encodeURIComponent(userFull || '');
  // forzo anche i due tipi di apostrofo se rimasti “nudi” nei path logger/stack
  key = key.replace(/'/g, '%27').replace(/’/g, '%E2%80%99');
  return key;
}

// Etichetta utente: M DAngelo
function labelUser(full) {
    const parts = full.split(" ");
    if (parts.length < 2) return full;
    const nome = parts[0];
    const cognome = parts.slice(1).join("").replace(/['’]/g, "");
    return nome[0].toUpperCase() + " " + cognome;
}

document.getElementById("utenteLabel").textContent = "Utente: " + labelUser(userFull);

// ----------------------
// Salva pasto
// ----------------------
document.getElementById("salvaBtn").onclick = async () => {
  const r = document.getElementById("rist").value;
  const d = document.getElementById("data").value;
  const i = document.getElementById("importo").value;

  if (!r || !d || !i) {
    alert("Compila tutti i campi.");
    return;
  }

  const payload = {
    utente: userFull,
    ristorante: r,
    data: d,
    importo: parseFloat(i)
  };

  // ---- LOG AVVIO ----
  console.log("[POST] URL:", `${API}/pasti`);
  console.log("[POST] userFull:", userFull);
  console.log("[POST] Payload:", payload);

  try {
    const res = await fetch(`${API}/pasti`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
      // mode: "cors", // opzionale; in genere non serve su Render
    });

    // ---- LOG RISPOSTA ----
    console.log("[POST] Status:", res.status, res.statusText);

    const txt = await res.text().catch(() => "");
    // Se il backend restituisce JSON, proviamo a parse solo in caso 2xx
    let json = null;
    if (res.ok) {
      try { json = txt ? JSON.parse(txt) : null; } catch { /* non JSON, ok */ }
    } else {
      console.log("[POST] Body (text):", txt);
      alert(`Errore salvataggio: ${res.status} ${res.statusText}\n${txt}`);
      return;
    }

    console.log("[POST] OK, body:", json ?? txt);
    caricaLista();
  } catch (e) {
    console.error("[POST] Network/CORS error:", e);
    alert("Errore di rete verso il backend:\n" + (e && e.message ? e.message : e));
  }
};

// ----------------------
// Carica lista pasti
// ----------------------
async function caricaLista() {
  const listaBox = document.getElementById("lista");
  listaBox.innerHTML = "";

  const url = `${API}/pasti/${_userKey()}`;
  console.log("[GET] userFull:", userFull);
  console.log("[GET] URL:", url);

  let r;
  try {
    r = await fetch(url, { cache: 'no-store' });
  } catch (e) {
    console.error("[GET] Network/CORS error:", e);
    alert("Errore rete nel caricamento lista:\n" + (e && e.message ? e.message : e));
    return;
  }

  console.log("[GET] Status:", r.status, r.statusText);
  if (!r.ok) {
    const txt = await r.text().catch(() => "");
    console.log("[GET] Body (text):", txt);
    alert(`Errore caricamento lista: ${r.status} ${r.statusText}\n${txt}`);
    return;
  }

  let dati;
  const txt = await r.text().catch(() => "");
  try { dati = txt ? JSON.parse(txt) : []; }
  catch (e) {
    console.error("[GET] JSON parse error:", e, "Body:", txt);
    alert("Errore parse dati lista (non JSON). Vedi console.");
    return;
  }
	// helper robusto per ricavare l'ID dal record
	function getId(p) {
	  return p?.id ?? p?._id ?? p?.ID ?? p?.Id ?? null;
	}

	for (const p of dati) {
	  const id = getId(p);
	  const div = document.createElement("div");
	  div.className = "list-item";
	  div.innerHTML = `
	  <div>
		<b>${p.ristorante}</b><br>
		${p.data} — ${p.importo} €
	  </div>
	  <div class="actions">
		<button onclick="modifica(${id}, '${p.ristorante}', '${p.data}', ${p.importo})">Modifica</button>
		<button class="delete" onclick="elimina(${id})">Elimina</button>
	  </div>
	  `;
	  listaBox.appendChild(div);
	}

    aggiornaTotale();
}

// ----------------------
// Elimina
// ----------------------
async function elimina(id) {
  if (!id) {
    alert("Elimina: ID non valido.");
    return;
  }
  if (!confirm(`Eliminare pasto #${id}?`)) return;

  const url = `${API}/pasti/${id}`;
  console.log("[DELETE] URL:", url);

  let res;
  try {
    res = await fetch(url, { method: "DELETE" });
  } catch (e) {
    console.error("[DELETE] Network/CORS error:", e);
    alert("Errore rete su DELETE:\n" + (e?.message || e));
    return;
  }

  console.log("[DELETE] Status:", res.status, res.statusText);
  if (!res.ok) {
    const txt = await res.text().catch(() => "");
    alert(`Errore eliminazione: ${res.status} ${res.statusText}\n${txt}`);
    return;
  }
  caricaLista();
}

// ----------------------
// Modifica
// ----------------------
async function modifica(id, rist, data, importo) {
  if (!id) { alert("Modifica: ID non valido."); return; }

  const nr = prompt("Ristorante:", rist);
  if (nr == null) return;
  const nd = prompt("Data (YYYY-MM-DD):", data);
  if (nd == null) return;
  const ni = prompt("Importo:", importo);
  if (ni == null) return;

  const payload = {
    utente: userFull,
    ristorante: nr,
    data: nd,
    importo: parseFloat(ni)
  };

  const url = `${API}/pasti/${id}`;
  console.log("[PUT] URL:", url);
  console.log("[PUT] Payload:", payload);

  let res;
  try {
    res = await fetch(url, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
  } catch (e) {
    console.error("[PUT] Network/CORS error:", e);
    alert("Errore rete su PUT:\n" + (e?.message || e));
    return;
  }

  console.log("[PUT] Status:", res.status, res.statusText);
  const txt = await res.text().catch(() => "");
  if (!res.ok) {
    console.log("[PUT] Body (text):", txt);
    alert(`Errore modifica: ${res.status} ${res.statusText}\n${txt}`);
    return;
  }
  console.log("[PUT] OK, body:", txt);
  caricaLista();
}

// ----------------------
// Totale
// ----------------------
async function aggiornaTotale() {
	const r = await fetch(`${API}/pasti/${_userKey()}/totale`, { cache: 'no-store' });
    const j = await r.json();
    document.getElementById("totaleBox").textContent = "Totale: " + j.totale + " €";
}

caricaLista();
</script>

<script>
if ("serviceWorker" in navigator) {
  // bump dell'URL per evitare cache del file SW
  navigator.serviceWorker.register("service-worker.js?v=4").then(reg => {
    reg.update?.();
  });

  // quando subentra il nuovo SW ricarico 1 sola volta
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloaded) return;
    reloaded = true;
    location.reload();
  });
}
</script>

<!-- Tesseract.js (CDN) -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.4/dist/tesseract.min.js" defer></script>

</body>
</html>
