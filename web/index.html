	<script>
	  // === FPFOOD — Scan inline (OCR + auto-fill + download foto) ===
	  window.addEventListener('load', () => {
		const $scanBtn  = document.getElementById('scanBtn');
		const $scanFile = document.getElementById('scan-file');
		const $rist     = document.getElementById('rist');
		const $data     = document.getElementById('data');
		const $importo  = document.getElementById('importo');

		function toISO(gg, mm, aa) {
		  // normalizza a numeri
		  let d = parseInt(String(gg).replace(/\D/g, ''), 10);
		  let m = parseInt(String(mm).replace(/\D/g, ''), 10);
		  let y = parseInt(String(aa).replace(/\D/g, ''), 10);

		  // anno a 2 cifre -> 20xx
		  if (y < 100) y += 2000;

		  // controlli base
		  if (!(y >= 2000 && y <= 2100)) return '';
		  if (!(m >= 1 && m <= 12)) return '';
		  if (!(d >= 1 && d <= 31)) return '';

		  const pad = (n) => String(n).padStart(2, '0');
		  return `${y}-${pad(m)}-${pad(d)}`;
		}

		// === Parser robusto per “Orto dei Longobardi” + fallback ===
        function parseQuick(text) {
          const raw = String(text || "");
          const lines = raw.split(/\r?\n/).map(s => s.trim()).filter(Boolean);

          // --- Ristorante (preferisci match esplicito Orto) ---
          let merchant = '';
          const whole = raw.toUpperCase().replace(/\s+/g, ' ');
          if (whole.includes('ORTO') && whole.includes('LONGOBARDI')) {
            merchant = 'Orto dei longobardi';
          } else {
            // fallback: prima riga non "SCONTRINO" con almeno 2 lettere
            for (const l of lines) {
              const u = l.toUpperCase();
              if (u.includes('SCONTRINO')) continue;
              if (/[A-Z]{2,}/.test(u)) { merchant = l; break; }
            }
          }

          // --- Data (preferisci riga con "DATA"/"EMESSO"/"ORA", poi globale) ---
          let dateISO = '';
          const pref = lines.filter(l => /DATA|EMESSO|ORA/i.test(l)).concat(lines);
          for (const l of pref) {
            let m;
            // dd/mm/yy(yy)
            m = l.match(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
            if (m) { dateISO = toISO(m[1], m[2], m[3]); if (dateISO) break; }
            // yyyy-mm-dd
            m = l.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
            if (m) { dateISO = toISO(m[3], m[2], m[1]); if (dateISO) break; }
          }

          // --- Importo (TOTALE COMPLESSIVO preferito) ---
          const takeAmounts = (s) => (String(s).match(/\d+[.,]\d{2}/g) || [])
                                       .map(v => v.replace(/\s+/g,'').replace(',','.'));
          let total = '';
          const totLines = lines.filter(l => /TOTALE|COMPLESSIV/i.test(l));
          for (const l of totLines) {
            const am = takeAmounts(l);
            if (am.length) total = am[am.length - 1]; // ultimo sulla riga del totale
          }
          if (!total) {
            const all = takeAmounts(raw);
            if (all.length) {
              // fallback: prendi il massimo come probabile totale
              total = all.map(parseFloat).reduce((a,b) => Math.max(a,b), 0).toFixed(2);
            }
          }

          return { merchant, dateISO, total };
        }

        // Mappatura ristorante (robusta)
        function mapRistorante(text) {
          const u = String(text || '').toUpperCase();
          if (u.includes('ORTO') && u.includes('LONGOBARDI')) return 'Orto dei longobardi';
          if (u.includes('SACE')) return 'Sace Group';
          return '';
        }

        function sanitizeName(s) {
          return (s || 'scontrino')
                  .normalize('NFKD').replace(/[^\w\s-]/g,'')
                  .trim().replace(/\s+/g,'_').toLowerCase();
        }

        // === Worker Tesseract persistente (caricato 1 volta e riusato) ===
        let _ocrWorker = null;
        async function _getWorker(statusCb) {
          if (_ocrWorker) return _ocrWorker;
          const logger = (m) => {
            if (statusCb && m?.status && m?.progress != null) {
              statusCb(`${m.status} ${Math.round(m.progress*100)}%`);
            } else {
              console.log(m?.status || '', m?.progress || '');
            }
          };
          const w = await Tesseract.createWorker('ita+eng', 1, { logger });
          _ocrWorker = w;
          return _ocrWorker;
        }

        // Riduci immagine (canvas) per velocizzare l’OCR
        async function _preprocessToBlob(file, maxSide=1200, quality=0.7) {
          const img = await new Promise((res, rej) => {
            const url = URL.createObjectURL(file);
            const i = new Image();
            i.onload = () => res({img:i, url});
            i.onerror = rej;
            i.src = url;
          });
          const {img:im, url} = img;
          const scale = Math.min(1, maxSide / Math.max(im.width, im.height));
          const w = Math.round(im.width * scale);
          const h = Math.round(im.height * scale);
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(im, 0, 0, w, h);
          const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', quality));
          URL.revokeObjectURL(url);
          return blob || file;
        }

        // OCR senza whitelist (serve testo per “ORTO”, “TOTALE COMPLESSIVO”)
        async function doOCR(file, statusCb) {
          const worker = await _getWorker(statusCb);
          const small = await _preprocessToBlob(file, 1200, 0.7);
          const config = {
            tessedit_pageseg_mode: 6
          };
          const { data } = await worker.recognize(small, { config });
          return (data && data.text) ? data.text : '';
        }

        function autoDownload(file, merchant) {
          const ts = new Date();
          const y = ts.getFullYear();
          const mo = String(ts.getMonth()+1).padStart(2,'0');
          const d = String(ts.getDate()).padStart(2,'0');
          const h = String(ts.getHours()).padStart(2,'0');
          const mi = String(ts.getMinutes()).padStart(2,'0');
          const s = String(ts.getSeconds()).padStart(2,'0');
          const name = `scan_${sanitizeName(merchant)}_${y}${mo}${d}_${h}${mi}${s}.jpg`;
          const url = URL.createObjectURL(file);
          const a = document.createElement('a');
          a.href = url;
          a.download = name;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
        }

		$scanBtn?.addEventListener('click', () => $scanFile?.click());

		$scanFile?.addEventListener('change', async () => {
		  const file = $scanFile.files?.[0];
		  if (!file) return;

		  const $status = document.getElementById('scanStatus');
		  const setStatus = (s) => { if ($status) $status.textContent = s; };

		  try {
			setStatus('Carico immagine...');
			// INFO rapida sul file
			console.log('SCAN file:', file?.type, Math.round((file?.size || 0)/1024), 'KB');

			if (typeof Tesseract === 'undefined') {
			  alert('Tesseract non caricato (rete/CDN o cache). Riprova dopo qualche secondo.');
			  setStatus('CDN non pronto');
			  return;
			}

			setStatus('Avvio OCR...');
			const text = await doOCR(file, setStatus);
			console.log('OCR text (first 120):', text.slice(0,120).replace(/\s+/g,' '));

			const { merchant, dateISO, total } = parseQuick(text);

			const ristValue = mapRistorante(text) || mapRistorante(merchant);
			if (ristValue) {
			  $rist.value = ristValue;
			} else {
			  console.log('OCR: ristorante non mappato (solo Orto è supportato).');
			}
			if (/^\d{4}-\d{2}-\d{2}$/.test(dateISO)) {
			  $data.value = dateISO;
			} else {
			  console.log('OCR: data non valida, non aggiorno il campo.', dateISO);
			}
			if (total)   { $importo.value = parseFloat(total).toFixed(2); }

			setStatus('Completato');
			if (dateISO || total) {
			  autoDownload(file, merchant || ristValue || 'scontrino');
			} else {
			  console.log('OCR: nessuna data/importo trovati — non salvo la foto.');
			}
		  } catch (e) {
			console.error('OCR error:', e);
			setStatus('Errore OCR');
			alert('Errore durante la scansione: ' + (e && e.message ? e.message : 'vedi console'));
		  } finally {
			$scanFile.value = ''; // per poter riselezionare lo stesso file
			setTimeout(() => setStatus('Pronto'), 1200);
		  }
		});

	  });
	</script>

<script>

/* === FPFOOD — USER MATCHING AVANZATO === */

/* Lista utenti autorizzati */
const FPFOOD_USERS = [
 { id: "apanella", full: "Panella Angela" },
 { id: "cbarca", full: "Barca Cristian" },
 { id: "fdelloste", full: "Dell'oste Francesco" },
 { id: "ggiancola", full: "Giancola Gianfranco" },
 { id: "gIorio", full: "Iorio Giovanni" },
 { id: "gromano", full: "Romano Giuseppe" },
 { id: "gtanucci", full: "Tanucci Giuseppe" },
 { id: "gzollo", full: "Zollo Gianluca" },
 { id: "liannella", full: "Iannella Luigi" },
 { id: "mberillo", full: "Berillo Mario" },
 { id: "mcapitanio", full: "Capitanio Maik" },
 { id: "mscimone", full: "Scimone Maurizio" },
 { id: "ncapitanio", full: "Capitanio Nazzareno" },
 { id: "niscaro", full: "Iscaro Nunzio" },
 { id: "pborzillo", full: "Borzillo Pompeo" },

];

/* Normalizzazione robusta */
function norm(s) {
 return (s || "")
   .toLowerCase()
   .normalize("NFD")
   .replace(/[\u0300-\u036f]/g, "")
   .replace(/['’]/g, "")
   .replace(/\s+/g, " ")
   .trim();
}

/* Similarità minima (Levenshtein dist ≤ 2) */
function lev(a, b) {
 const m = a.length, n = b.length;
 const dp = Array.from({length: m+1}, () => Array(n+1).fill(0));
 for (let i=0;i<=m;i++) dp[i][0]=i;
 for (let j=0;j<=n;j++) dp[0][j]=j;
 for (let i=1;i<=m;i++){
   for (let j=1;j<=n;j++){
     dp[i][j] = Math.min(
       dp[i-1][j] + 1,
       dp[i][j-1] + 1,
       dp[i-1][j-1] + (a[i-1]===b[j-1]?0:1)
     );
   }
 }
 return dp[m][n];
}

/* Funzione match */
function matchUser(input) {
 const nIn = norm(input);
 if (!nIn) return null;

 let best = null;
 let bestScore = 999;

 for (const u of FPFOOD_USERS) {
   const nDb = norm(u.full);

   // Prova → diretto / invertito
   const parts = nDb.split(" ");
   const inv = parts.slice().reverse().join(" ");

   const candidates = [nDb, inv];

   for (const c of candidates) {
     const dist = lev(nIn, c);
     if (dist < bestScore) {
       bestScore = dist;
       best = u;
     }
   }
 }

 return bestScore <= 2 ? best : null;
}

/* Primo login */
let storedId = localStorage.getItem("fpfood_user_id");
let storedFull = localStorage.getItem("fpfood_user_full");

if (!storedId) {
 let nome = "";
 while (!nome.trim()) {
   nome = prompt("Inserisci Nome e Cognome:");
 }

 const match = matchUser(nome);
 if (!match) {

 }

 localStorage.setItem("fpfood_user_id", match.id);
 localStorage.setItem("fpfood_user_full", match.full);

 storedId = match.id;
 storedFull = match.full;

/* Utente corrente */

const userFull = storedFull;

/* Admin */
const isAdmin = (userId === "fdelloste");

// === ADMIN CHECK (solo fdelloste) ===
/* placeholder — rimosso perché ridefinito più avanti */

// Chiave URL robusta (codifica /, spazi, e TUTTI gli apostrofi)
function _userKey() {
  // chiave = userId sempre
  return encodeURIComponent(userId || '');
}

// Etichetta utente: M DAngelo
function labelUser(full) {
    const parts = full.split(" ");
    if (parts.length < 2) return full;
    const nome = parts[0];
    const cognome = parts.slice(1).join("").replace(/['’]/g, "");
    return nome[0].toUpperCase() + " " + cognome;
}

document.getElementById("utenteLabel").textContent = "Utente: " + labelUser(userFull);

/* === CAMBIO UTENTE === */
(function(){
  const cont = document.getElementById("utenteLabel").parentElement;
  const btn = document.createElement("button");

  btn.style.padding = "6px 12px";

      const sel = prompt(list + "\n\nInserisci ID utente esatto:");

    }

    /* NON ADMIN → prompt nome e cognome e fuzzy match */
    let nome = "";
    while (!nome.trim()) {
      nome = prompt("Inserisci Nome e Cognome:");
      if (nome === null) return;
    }

    const match = matchUser(nome);
    if (!match) {

      return;
    }

    localStorage.setItem("fpfood_user_id", match.id);
    localStorage.setItem("fpfood_user_full", match.full);

  };
})();

// === Punto 2: listener filtri ===
document.getElementById("filtroMese")?.addEventListener("change", () => caricaLista());

// Salva pasto
// ----------------------
document.getElementById("salvaBtn").onclick = async () => {
  const r = document.getElementById("rist").value;
  const d = document.getElementById("data").value;
  const i = document.getElementById("importo").value;

  if (!r || !d || !i) {

  }

  const payload = {
    utente: userId,

    data: d,

  };

  // ---- LOG AVVIO ----

  console.log("[POST] userFull:", userFull);
  console.log("[POST] Payload:", payload);

  try {
    const res = await fetch(`${API}/pasti`, {
      method: "POST",

      // mode: "cors", // opzionale; in genere non serve su Render
    });

    // ---- LOG RISPOSTA ----

    const txt = await res.text().catch(() => "");

    let json = null;
    if (res.ok) {
      try { json = txt ? JSON.parse(txt) : null; } catch { /* non JSON, ok */ }

    }

    console.log("[POST] OK, body:", json ?? txt);

  } catch (e) {

};

// ----------------------
// Carica lista pasti + FILTRI (mese/ristorante) 
// ----------------------
let __ultimo_filtrato = [];

// === FPFOOD — Budget mensile per utente ===
let __budget_map = null; // { 'YYYY-MM': number }

function _monthKeyFromInputValue() {
  const fm = document.getElementById("filtroMese")?.value || "";
  if (fm) return fm; // già YYYY-MM
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
}

// Converte label MySQL (es. "Feb_2026" oppure "Febbraio_2026") -> "2026-02"
// Accetta anche "2026-02" e "02/2026"
function _parse_mysql_month_label(label) {
  const s = String(label || '').trim();
  if (!s) return '';
  let m = s.match(/^([A-Za-zÀ-ÿ]+)_(\d{4})$/);
  if (m) {
    const name = m[1].toLowerCase();
    const y = m[2];
    const map = {
      gen:1, gennaio:1, jan:1,
      feb:2, febbraio:2,
      mar:3, marzo:3,
      apr:4, aprile:4,
      mag:5, maggio:5, may:5,
      giu:6, giugno:6,
      lug:7, luglio:7, jul:7,
      ago:8, agosto:8,
      set:9, sep:9, settembre:9,
      ott:10, oct:10, ottobre:10,
      nov:11, novembre:11,
      dic:12, dec:12, dicembre:12
    };
    const mm = map[name];
    if (mm) return `${y}-${String(mm).padStart(2,'0')}`;
  }
  m = s.match(/^(\d{4})-(\d{2})$/);
  if (m) return `${m[1]}-${m[2]}`;
  m = s.match(/^(\d{1,2})\/(\d{4})$/);
  if (m) return `${m[2]}-${String(m[1]).padStart(2,'0')}`;
  return '';
}

// Carica i budget dell’utente una sola volta e li mappa per mese
async function _ensureBudgetLoadedOnce() {
  if (__budget_map !== null) return __budget_map;
  __budget_map = {};
  try {
    const url = `${API}/budget/${_userKey()}`;
    const r = await fetch(url, { cache: "no-store" });
    const txt = await r.text().catch(() => "");
    let rows = [];
    try { rows = txt ? JSON.parse(txt) : []; } catch { rows = []; }
    for (const row of rows) {
      const key = _parse_mysql_month_label(row.Mese || row.mese || row.MESE);
      const val = parseFloat(row.Budget ?? row.budget ?? row.BUDGET);
      if (key && isFinite(val)) __budget_map[key] = val;
    }
    console.log("[BUDGET] map:", __budget_map);
  } catch (e) {
    console.error("[BUDGET] load error:", e);
  }
  return __budget_map;
}

function _ensureDefaultMonthFromBudget(){
  try {
    const fm = document.getElementById('filtroMese');
    if (!fm || fm.value) return; // già scelto manualmente
    const keys = Object.keys(__budget_map || {}).sort(); // YYYY-MM in ordine
    if (keys.length) {
      fm.value = keys[keys.length - 1]; // ultimo = più recente
    }
  } catch (e) { /* no-op */ }
}
async function caricaLista() {
  const listaBox = document.getElementById("lista");
  listaBox.innerHTML = "";

  const url = `${API}/pasti/${_userKey()}`;
  let r;
  try {
    r = await fetch(url, { cache: "no-store" });
  } catch (e) {
    console.error("[GET] Network/CORS error:", e);
    alert("Errore rete nel caricamento lista.");
    return;
  }
  if (!r.ok) {
    const txt = await r.text().catch(() => "");
    alert(`Errore caricamento lista: ${r.status} ${r.statusText}\n${txt}`);
    return;
  }

  const txt = await r.text().catch(() => "");
  let dati = [];
  try { dati = txt ? JSON.parse(txt) : []; }
  catch (e) {
    console.error("[GET] JSON parse error:", e, "Body:", txt);
    alert("Errore parse dati lista (non JSON).");
    return;
  }

  // === FILTRI Punto 2 ===
  const fm = document.getElementById("filtroMese")?.value || "";   // YYYY-MM
  const fr = document.getElementById("filtroRisto")?.value || "";  // string o "" (Tutti)

  let filtrati = dati;
  if (fm) filtrati = filtrati.filter(p => (p.data || "").startsWith(fm));
  if (fr) filtrati = filtrati.filter(p => p.ristorante === fr);

  __ultimo_filtrato = filtrati;

  // helper ID
  const getId = p => p?.id ?? p?._id ?? p?.ID ?? p?.Id ?? null;

  for (const p of filtrati) {
    const id = getId(p);
    if (!id) continue;

    const div = document.createElement("div");
    div.className = "list-item";
    div.innerHTML = `
      <div>
        <b>${p.ristorante}</b><br>
        ${p.data} — ${p.importo} €
      </div>
      <div class="actions">
        <button onclick="modifica(${id}, '${p.ristorante}', '${p.data}', ${p.importo})">Modifica</button>
        <button class="delete" onclick="elimina(${id})">Elimina</button>
      </div>
    `;
    listaBox.appendChild(div);
  }

  aggiornaTotale(); // ora calcola dal filtrato
}

// ----------------------
// Elimina
// ----------------------
async function elimina(id) {
  if (!id) {
    alert("Elimina: ID non valido.");
    return;
  }
  if (!confirm(`Eliminare pasto #${id}?`)) return;

  const url = `${API}/pasti/${id}`;
  console.log("[DELETE] URL:", url);

  let res;
  try {
    res = await fetch(url, { method: "DELETE" });
  } catch (e) {
    console.error("[DELETE] Network/CORS error:", e);
    alert("Errore rete su DELETE:\n" + (e?.message || e));
    return;
  }

  console.log("[DELETE] Status:", res.status, res.statusText);
  if (!res.ok) {
    const txt = await res.text().catch(() => "");
    alert(`Errore eliminazione: ${res.status} ${res.statusText}\n${txt}`);
    return;
  }
  caricaLista();
}

// ----------------------
// Modifica
// ----------------------
async function modifica(id, rist, data, importo) {
  if (!id) { alert("Modifica: ID non valido."); return; }

  const nr = prompt("Ristorante:", rist);
  if (nr == null) return;
  const nd = prompt("Data (YYYY-MM-DD):", data);
  if (nd == null) return;
  const ni = prompt("Importo:", importo);
  if (ni == null) return;

  const payload = {
    utente: userId,
    ristorante: nr,
    data: nd,
    importo: parseFloat(ni)
  };

  let res;
  try {
    const url = `${API}/pasti/${id}`;
    res = await fetch(url, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
  } catch (e) {
    console.error("[PUT] Network/CORS error:", e);
    alert("Errore rete su PUT:\n" + (e?.message || e));
    return;
  }

  console.log("[PUT] Status:", res.status, res.statusText);
  const txt = await res.text().catch(() => "");
  if (!res.ok) {
    console.log("[PUT] Body (text):", txt);
    alert(`Errore modifica: ${res.status} ${res.statusText}\n${txt}`);
    return;
  }
  console.log("[PUT] OK, body:", txt);
  caricaLista();
}

// ----------------------
// Totale
// ----------------------
function aggiornaTotale() {
  const sum = (__ultimo_filtrato || []).reduce((acc, p) => acc + (parseFloat(p.importo) || 0), 0);
  const totBox = document.getElementById("totaleBox");
  if (totBox) totBox.textContent = "Totale: " + EUR.format(sum);

  // Budget mensile e Restante
  const monthKey = _monthKeyFromInputValue(); // "YYYY-MM"
  const budget = (__budget_map && __budget_map[monthKey] != null) ? Number(__budget_map[monthKey]) : null;

  const bBox = document.getElementById("budgetBox");
  if (bBox) bBox.textContent = "Budget mensile: " + (budget != null ? EUR.format(budget) : "—");

  const rBox = document.getElementById("restanteBox");
  if (rBox) rBox.textContent = "Restante: " + (budget != null ? EUR.format(budget - sum) : "—");
}

_ensureBudgetLoadedOnce().finally(() => {
  _ensureDefaultMonthFromBudget(); // <-- setta il mese disponibile (se il filtro è vuoto)
  caricaLista();
});

</script>

<script>
if ("serviceWorker" in navigator && !location.hostname.includes("127.0.0.1") && !location.hostname.includes("localhost")) {
  // bump dell'URL per evitare cache del file SW
  navigator.serviceWorker.register("service-worker.js?v=8").then(reg => {
    reg.update?.();
  });

  // quando subentra il nuovo SW ricarico 1 sola volta
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloaded) return;
    reloaded = true;
    location.reload();
  });
}
</script>
