<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>FPFood</title>

    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0066cc" />

    <style>
        body { 
            font-family: system-ui, sans-serif; 
            margin: 0; 
            background: #f5f5f5;
        }
        header {
            background: #0066cc;
            padding: 12px;
            display: flex;
            align-items: center;
            color: white;
        }
        header img {
            height: 48px;
            margin-right: 12px;
        }
        main {
            padding: 16px;
            max-width: 600px;
            margin: auto;
        }
        label { margin-top: 12px; display: block; }
        input, select, button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            margin-top: 6px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }
        button {
            background: #0066cc;
            color: white;
            border: none;
            margin-top: 20px;
        }
        .list-item {
            background: white;
            padding: 12px;
            margin-top: 10px;
            border-radius: 6px;
            border: 1px solid #ddd;
        }
        .actions {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }
        .actions button {
            flex: 1;
            background: #444;
        }
        .actions .delete {
            background: #aa0000;
        }
        .totale {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<!-- FPFOOD — OCR Scontrino (Punto 1) -->
<section id="fpfood-ocr" style="padding:12px;border-top:1px solid #ddd;margin-top:16px;font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif">
  <h3 style="margin:0 0 8px 0;font-size:16px;">OCR Scontrino</h3>

  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px">
    <input id="fpfood-ocr-file" type="file" accept="image/*" capture="environment" style="max-width:260px">
    <button id="fpfood-ocr-run" style="padding:8px 12px;border-radius:6px;border:1px solid #999;background:#f5f5f5;cursor:pointer">
      Esegui OCR
    </button>
    <span id="fpfood-ocr-progress" style="font-size:12px;color:#555">Pronto</span>
  </div>

  <div style="display:flex;gap:12px;flex-wrap:wrap">
    <div style="flex:1;min-width:260px">
      <label for="fpfood-ocr-raw" style="font-size:12px;color:#333">Testo riconosciuto</label>
      <textarea id="fpfood-ocr-raw" rows="8" style="width:100%;box-sizing:border-box"></textarea>
    </div>
    <div style="flex:1;min-width:220px">
      <label style="font-size:12px;color:#333;display:block">Parsing rapido</label>
      <div style="display:grid;grid-template-columns:100px 1fr;gap:6px;align-items:center">
        <span style="font-size:12px;color:#666">Esercente</span><input id="fpfood-ocr-merchant" />
        <span style="font-size:12px;color:#666">Data</span><input id="fpfood-ocr-date" />
        <span style="font-size:12px;color:#666">Totale</span><input id="fpfood-ocr-total" />
      </div>
    </div>
  </div>
</section>

<!-- Tesseract.js (CDN) -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.4/dist/tesseract.min.js" defer></script>

<script>
  (function () {
    const $file = document.getElementById('fpfood-ocr-file');
    const $btn  = document.getElementById('fpfood-ocr-run');
    const $raw  = document.getElementById('fpfood-ocr-raw');
    const $prg  = document.getElementById('fpfood-ocr-progress');
    const $merchant = document.getElementById('fpfood-ocr-merchant');
    const $date = document.getElementById('fpfood-ocr-date');
    const $total = document.getElementById('fpfood-ocr-total');

    async function runOCR(file) {
      $prg.textContent = 'Caricamento...';
      const worker = await Tesseract.createWorker('ita', 1, {
        logger: m => {
          if (m.status && m.progress != null) {
            const pct = Math.round(m.progress * 100);
            $prg.textContent = m.status + ' ' + pct + '%';
          }
        }
      });
      try {
        const { data } = await worker.recognize(file);
        return (data && data.text) ? data.text : '';
      } finally {
        await worker.terminate();
        $prg.textContent = 'Pronto';
      }
    }

    function parseQuick(text) {
      // parsing semplice e robusto, senza regex complesse
      const lines = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);

      // Esercente: prima riga non vuota e non “scontrino fiscale”
      let merchant = '';
      for (const l of lines) {
        const u = l.toUpperCase();
        if (u.includes('SCONTRINO')) continue;
        merchant = l;
        break;
      }

      // Data: cerca formato dd/mm/yyyy o dd-mm-yyyy
      let date = '';
      for (const l of lines) {
        const m = l.match(/(\b\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}\b)/);
        if (m) { date = m[1]; break; }
      }

      // Totale: riga con “TOTALE” o “EUR” o importi con virgola
      let total = '';
      const candidate = lines.find(l =>
        l.toUpperCase().includes('TOTALE') ||
        l.toUpperCase().includes('EUR') ||
        l.match(/\d+[\.,]\d{2}/)
      );
      if (candidate) {
        const m = candidate.match(/(\d+[.,]\d{2})/);
        if (m) total = m[1].replace(',', '.');
      }

      return { merchant, date, total };
    }

    $btn?.addEventListener('click', async () => {
      const file = $file?.files?.[0];
      if (!file) {
        $prg.textContent = 'Seleziona una foto dello scontrino';
        return;
      }
      $btn.disabled = true;
      try {
        const text = await runOCR(file);
        $raw.value = text || '';
        const { merchant, date, total } = parseQuick(text || '');
        $merchant.value = merchant || '';
        $date.value = date || '';
        $total.value = total || '';
      } catch (err) {
        console.error(err);
        $prg.textContent = 'Errore OCR';
      } finally {
        $btn.disabled = false;
      }
    });
  })();
</script>

</body>
<header>
    <img src="icons/azienda.png" alt="logo" />
    <h2>FPFood</h2>
</header>

<main>

    <h3 id="utenteLabel"></h3>

    <label>Ristorante</label>
    <select id="rist">
        <option value="">Seleziona</option>
        <option>Orto dei longobardi</option>
        <option>Sace Group</option>
    </select>

    <label>Data</label>
    <input type="date" id="data" />

	<label>Importo</label>
	<div style="display:flex;gap:8px;align-items:center">
	  <input type="number" step="0.01" id="importo" style="flex:1"/>
	  <img id="scanBtn" src="icons/scan.png" alt="Scansione scontrino" title="Scansiona scontrino"
		   style="width:28px;height:28px;cursor:pointer;border-radius:6px;border:1px solid #ccc;padding:4px;background:#fff"/>
	</div>
	<button id="salvaBtn">Salva</button>

    <h3>📋 Pasti salvati</h3>
    <div id="lista"></div>

    <div class="totale" id="totaleBox">Totale: 0 €</div>

</main>

<script>
const API = "https://fpfood-backend.onrender.com/api";

// ----------------------
// UTENTE (solo prima volta)
// ----------------------
if (!localStorage.getItem("fpfood_user")) {
    let nome = "";
    while (!nome.trim()) {
        nome = prompt("Inserisci Nome e Cognome:");
    }
    localStorage.setItem("fpfood_user", nome.trim());
}

const userFull = localStorage.getItem("fpfood_user");

// Etichetta utente: M DAngelo
function labelUser(full) {
    const parts = full.split(" ");
    if (parts.length < 2) return full;
    const nome = parts[0];
    const cognome = parts.slice(1).join("").replace(/['’]/g, "");
    return nome[0].toUpperCase() + " " + cognome;
}

document.getElementById("utenteLabel").textContent = "Utente: " + labelUser(userFull);

// FPFOOD — hook icona scansione (apre il picker OCR e scrolla alla sezione)
const scanBtn = document.getElementById("scanBtn");
if (scanBtn) {
  scanBtn.addEventListener("click", () => {
    const ocrSection = document.getElementById("fpfood-ocr");
    const file = document.getElementById("fpfood-ocr-file");
    if (ocrSection) ocrSection.scrollIntoView({ behavior: "smooth", block: "start" });
    if (file) file.click();
  });
}


// ----------------------
// Salva pasto
// ----------------------
document.getElementById("salvaBtn").onclick = async () => {
    const r = document.getElementById("rist").value;
    const d = document.getElementById("data").value;
    const i = document.getElementById("importo").value;

    if (!r || !d || !i) {
        alert("Compila tutti i campi.");
        return;
    }

    const payload = {
        utente: userFull,
        ristorante: r,
        data: d,
        importo: parseFloat(i)
    };

    await fetch(`${API}/pasti`, {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify(payload)
    });

    caricaLista();
};

// ----------------------
// Carica lista pasti
// ----------------------
async function caricaLista() {
    const listaBox = document.getElementById("lista");
    listaBox.innerHTML = "";

    const r = await fetch(`${API}/pasti/${encodeURIComponent(userFull)}`);
    const dati = await r.json();

    for (const p of dati) {
        const div = document.createElement("div");
        div.className = "list-item";

        div.innerHTML = `
            <div>
                <b>${p.ristorante}</b><br>
                ${p.data} — ${p.importo} €
            </div>
            <div class="actions">
                <button onclick="modifica(${p.id}, '${p.ristorante}', '${p.data}', ${p.importo})">Modifica</button>
                <button class="delete" onclick="elimina(${p.id})">Elimina</button>
            </div>
        `;

        listaBox.appendChild(div);
    }

    aggiornaTotale();
}

// ----------------------
// Elimina
// ----------------------
async function elimina(id) {
    if (!confirm("Eliminare pasto?")) return;

    await fetch(`${API}/pasti/${id}`, { method: "DELETE" });
    caricaLista();
}

// ----------------------
// Modifica
// ----------------------
async function modifica(id, rist, data, importo) {
    const nr = prompt("Ristorante:", rist);
    if (!nr) return;

    const nd = prompt("Data (YYYY-MM-DD):", data);
    if (!nd) return;

    const ni = prompt("Importo:", importo);
    if (!ni) return;

    const payload = {
        utente: userFull,
        ristorante: nr,
        data: nd,
        importo: parseFloat(ni)
    };

    await fetch(`${API}/pasti/${id}`, {
        method: "PUT",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify(payload)
    });

    caricaLista();
}

// ----------------------
// Totale
// ----------------------
async function aggiornaTotale() {
    const r = await fetch(`${API}/pasti/${encodeURIComponent(userFull)}/totale`);
    const j = await r.json();
    document.getElementById("totaleBox").textContent = "Totale: " + j.totale + " €";
}

caricaLista();
</script>

<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
